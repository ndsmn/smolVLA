name: Verify results
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify reported results, links and artifact hashes
        run: python scripts/verify_evidence.py
      - name: Check Python source syntax
        run: python -m compileall -q env_rebuild training scripts tools
